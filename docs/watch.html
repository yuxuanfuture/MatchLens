<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>MatchLens Pocket Stadium — Demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #071712;
        color: #f7fbf9;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(154, 230, 0, 0.18), transparent 42rem),
          #071712;
      }

      main {
        width: min(1120px, 100%);
        padding: clamp(20px, 4vw, 48px);
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.4rem, 3vw, 2.4rem);
        letter-spacing: -0.03em;
      }

      p { margin: 6px 0 0; color: #b7c9c1; }

      a { color: #b9f227; text-decoration: none; }
      a:hover { text-decoration: underline; }

      video {
        display: block;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        background: #000;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.46);
      }

      @media (max-width: 680px) {
        header { align-items: start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>MatchLens Pocket Stadium</h1>
          <p>English-subtitled product demo</p>
        </div>
        <a href="https://github.com/yuxuanfuture/MatchLens">View the GitHub repository</a>
      </header>
      <video controls preload="metadata" poster="./cover/titlepage.png">
        <source src="./video/MatchLens_Pocket_Stadium_EN_Subtitled.mp4" type="video/mp4">
        Your browser does not support HTML video. You can
        <a href="./video/MatchLens_Pocket_Stadium_EN_Subtitled.mp4">download the MP4</a> instead.
      </video>
    </main>
  </body>
</html>
