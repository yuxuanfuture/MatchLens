<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1100" viewBox="0 0 1280 1100" role="img" aria-labelledby="title desc">
  <title id="title">MatchLens multi-agent system architecture with rounded routing</title>
  <desc id="desc">Received football events pass through time and coverage gates into frozen evidence and deterministic tools. A fail-closed, budget-limited coordinator may delegate to scout, tactics, audience, and recap agents. Shared findings become a candidate explanation that an independent verifier approves or returns for one revision. Reviewed or offline results feed the Pocket Stadium, evidence panel, and timed overlay.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#60766f"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d67a2c"/>
    </marker>
    <marker id="arrow-agent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#79a714"/>
    </marker>
    <style>
      .canvas { fill: #f7fbf9; }
      .frame { fill: #eef6f2; stroke: #b6c8c1; }
      .node { fill: #ffffff; stroke: #8ca39b; }
      .agent { fill: #f3f9e8; stroke: #8ab622; }
      .control { fill: #fff7e9; stroke: #d99a36; }
      .review { fill: #eaf4ff; stroke: #5791c8; }
      .output { fill: #e9f8f1; stroke: #318568; }
      .title { fill: #092b24; font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; }
      .section { fill: #446059; font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.4px; }
      .label { fill: #102d27; font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #49635c; font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; }
      .edge-label { fill: #5a706a; font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; }
      .line { fill: none; stroke: #60766f; stroke-width: 2; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #60766f; stroke-width: 2; }
      .junction { fill: #60766f; }
      .delegate-bus { fill: none; stroke: #79a714; stroke-width: 2; }
      .delegate { fill: none; stroke: #79a714; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-agent); }
      .reject { fill: none; stroke: #d67a2c; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-warn); }
      .line, .branch, .delegate-bus, .delegate, .reject { stroke-linecap: round; stroke-linejoin: round; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #0b1512; }
        .frame { fill: #12231e; stroke: #365049; }
        .node { fill: #14211e; stroke: #607a71; }
        .agent { fill: #1c2a15; stroke: #91b93c; }
        .control { fill: #2a2113; stroke: #c99039; }
        .review { fill: #122637; stroke: #5791c8; }
        .output { fill: #123126; stroke: #46a17f; }
        .title, .label { fill: #eef8f4; }
        .section, .small, .edge-label { fill: #abc0b9; }
        .line, .branch { stroke: #809b92; }
        .junction { fill: #809b92; }
      }
    </style>
  </defs>

  <rect class="canvas" x="10" y="10" width="1260" height="1080" rx="24"/>
  <text class="title" x="640" y="52" text-anchor="middle">MatchLens · Evidence-Grounded Multi-Agent System</text>
  <text class="section" x="48" y="92">EVIDENCE LAYER</text>

  <rect class="node" x="40" y="112" width="250" height="74" rx="14"/>
  <text class="label" x="165" y="142" text-anchor="middle">Received events &amp; tracking</text>
  <text class="small" x="165" y="165" text-anchor="middle">replay or live synthetic stream</text>

  <rect class="node" x="350" y="112" width="220" height="74" rx="14"/>
  <text class="label" x="460" y="142" text-anchor="middle">Time &amp; coverage gate</text>
  <text class="small" x="460" y="165" text-anchor="middle">no future or missing facts</text>

  <rect class="node" x="630" y="112" width="230" height="74" rx="14"/>
  <text class="label" x="745" y="142" text-anchor="middle">Frozen evidence snapshot</text>
  <text class="small" x="745" y="165" text-anchor="middle">immutable observation window</text>

  <rect class="node" x="920" y="112" width="310" height="74" rx="14"/>
  <text class="label" x="1075" y="142" text-anchor="middle">Deterministic football tools</text>
  <text class="small" x="1075" y="165" text-anchor="middle">metrics · events · players · evidence</text>

  <path class="line" d="M290 149 H350"/>
  <path class="line" d="M570 149 H630"/>
  <path class="line" d="M860 149 H920"/>

  <!-- One evidence bus feeds the default offline path and the optional agent path. -->
  <path class="branch" d="M1075 186 V203 Q1075 215 1063 215 H155"/>
  <circle class="junction" cx="775" cy="215" r="4"/>
  <path class="line" d="M155 215 V300"/>
  <path class="line" d="M775 215 V305"/>

  <text class="section" x="350" y="244">OPTIONAL BOUNDED MULTI-AGENT SYSTEM</text>
  <rect class="frame" x="320" y="255" width="920" height="565" rx="22"/>

  <rect class="control" x="350" y="290" width="220" height="68" rx="14"/>
  <text class="label" x="460" y="319" text-anchor="middle">Fail-closed policy</text>
  <text class="small" x="460" y="342" text-anchor="middle">explicit provider approval</text>

  <rect class="control" x="350" y="376" width="220" height="68" rx="14"/>
  <text class="label" x="460" y="404" text-anchor="middle">Execution budgets</text>
  <text class="small" x="460" y="426" text-anchor="middle">model · tools · turns · wall clock</text>

  <rect class="agent" x="650" y="305" width="250" height="74" rx="16"/>
  <text class="label" x="775" y="336" text-anchor="middle">Coordinator</text>
  <text class="small" x="775" y="359" text-anchor="middle">route · delegate · synthesize</text>

  <path class="line" d="M570 324 H650"/>
  <path class="line" d="M570 410 H603 Q615 410 615 398 V372 Q615 360 627 360 H650"/>

  <rect class="agent" x="370" y="500" width="170" height="70" rx="14"/>
  <text class="label" x="455" y="531" text-anchor="middle">Scout</text>
  <text class="small" x="455" y="553" text-anchor="middle">find changes</text>

  <rect class="agent" x="580" y="500" width="170" height="70" rx="14"/>
  <text class="label" x="665" y="531" text-anchor="middle">Tactics</text>
  <text class="small" x="665" y="553" text-anchor="middle">test patterns</text>

  <rect class="agent" x="790" y="500" width="170" height="70" rx="14"/>
  <text class="label" x="875" y="531" text-anchor="middle">Audience</text>
  <text class="small" x="875" y="553" text-anchor="middle">adapt presentation</text>

  <rect class="agent" x="1000" y="500" width="170" height="70" rx="14"/>
  <text class="label" x="1085" y="531" text-anchor="middle">Recap</text>
  <text class="small" x="1085" y="553" text-anchor="middle">summarize window</text>

  <!-- A single delegation bus keeps the four role edges aligned and clear of controls. -->
  <path class="delegate-bus" d="M775 379 V470 H455 M455 470 H1085"/>
  <path class="delegate" d="M455 470 V500"/>
  <path class="delegate" d="M665 470 V500"/>
  <path class="delegate" d="M875 470 V500"/>
  <path class="delegate" d="M1085 470 V500"/>
  <text class="edge-label" x="792" y="459">may delegate</text>

  <rect class="node" x="570" y="630" width="400" height="66" rx="14"/>
  <text class="label" x="770" y="658" text-anchor="middle">Shared working memory</text>
  <text class="small" x="770" y="680" text-anchor="middle">computed facts and specialist reports for this observation</text>

  <!-- Specialist reports converge from the outside in without crossing one another. -->
  <path class="line" d="M455 570 V582 Q455 590 463 590 H612 Q620 590 620 598 V630"/>
  <path class="line" d="M665 570 V582 Q665 590 673 590 H692 Q700 590 700 598 V630"/>
  <path class="line" d="M875 570 V582 Q875 590 867 590 H848 Q840 590 840 598 V630"/>
  <path class="line" d="M1085 570 V582 Q1085 590 1077 590 H928 Q920 590 920 598 V630"/>

  <rect class="node" x="380" y="750" width="215" height="64" rx="14"/>
  <text class="label" x="487" y="777" text-anchor="middle">Coordinator synthesis</text>
  <text class="small" x="487" y="799" text-anchor="middle">claims · evidence · audiences</text>

  <rect class="review" x="665" y="750" width="205" height="64" rx="14"/>
  <text class="label" x="767" y="777" text-anchor="middle">Independent verifier</text>
  <text class="small" x="767" y="799" text-anchor="middle">approve or reject</text>

  <rect class="output" x="940" y="750" width="220" height="64" rx="14"/>
  <text class="label" x="1050" y="777" text-anchor="middle">Reviewed result</text>
  <text class="small" x="1050" y="799" text-anchor="middle">supported or abstained</text>

  <path class="line" d="M770 696 V714 Q770 720 764 720 H493 Q487 720 487 726 V750"/>
  <path class="line" d="M595 782 H665"/>
  <path class="line" d="M870 782 H940"/>
  <path class="reject" d="M835 750 V728 Q835 720 843 720 H1193 Q1205 720 1205 708 V354 Q1205 342 1193 342 H900"/>
  <text class="edge-label" x="1038" y="712" text-anchor="middle">reject · one revision</text>

  <rect class="node" x="40" y="320" width="230" height="72" rx="14"/>
  <text class="label" x="155" y="350" text-anchor="middle">Offline fact publisher</text>
  <text class="small" x="155" y="373" text-anchor="middle">default · no model required</text>

  <text class="section" x="48" y="890">DELIVERY LAYER</text>
  <rect class="output" x="430" y="860" width="420" height="72" rx="16"/>
  <text class="label" x="640" y="890" text-anchor="middle">Evidence-linked insight contract</text>
  <text class="small" x="640" y="913" text-anchor="middle">Fan and Analyst text · facts · cues · evidence IDs</text>

  <path class="line" d="M155 392 V410 H288 Q300 410 300 422 V884 Q300 896 312 896 H430"/>
  <path class="line" d="M1050 814 V825 Q1050 830 1045 830 H645 Q640 830 640 835 V860"/>

  <rect class="node" x="120" y="1010" width="280" height="62" rx="14"/>
  <text class="label" x="260" y="1037" text-anchor="middle">Pocket Stadium</text>
  <text class="small" x="260" y="1058" text-anchor="middle">Fan / Analyst interface</text>

  <rect class="node" x="500" y="1010" width="280" height="62" rx="14"/>
  <text class="label" x="640" y="1037" text-anchor="middle">Evidence panel</text>
  <text class="small" x="640" y="1058" text-anchor="middle">records and deterministic metrics</text>

  <rect class="node" x="880" y="1010" width="280" height="62" rx="14"/>
  <text class="label" x="1020" y="1037" text-anchor="middle">Timed overlay &amp; recap</text>
  <text class="small" x="1020" y="1058" text-anchor="middle">broadcast and machine-readable output</text>

  <path class="line" d="M640 932 V956 Q640 968 628 968 H272 Q260 968 260 980 V1010"/>
  <path class="line" d="M640 932 V1010"/>
  <path class="line" d="M640 932 V956 Q640 968 652 968 H1008 Q1020 968 1020 980 V1010"/>
</svg>
