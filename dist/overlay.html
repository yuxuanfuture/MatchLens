<!doctype html><html lang="zh"><meta charset="utf-8"><link rel="stylesheet" href="./i18n.css"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MatchLens · Broadcast Overlay</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:transparent;font:18px system-ui;color:#173731}#toolbar{padding:14px;background:#fff6e8;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit}#stage{position:relative;min-height:75vh}video{width:100%;max-height:85vh;background:#152a23}#cue{position:absolute;bottom:7%;left:5%;max-width:min(650px,88vw);background:#fff9edee;border-left:7px solid #f48d6b;border-radius:20px;padding:22px;box-shadow:0 10px 40px #0002}#cue h2{margin:6px 0;font-size:25px}#cue p{line-height:1.6;margin:8px 0}#refs{font-size:12px;opacity:.7}#status{font-size:13px}body.transparent #toolbar,body.transparent video{display:none}body.transparent #stage{height:100vh}</style>
<div id="toolbar"><a href="./">Pocket Stadium</a><label>本地视频 <input id="media" type="file" accept="video/*"></label><label>视频对应事件起点（秒） <input id="offset" type="number" value="0" min="0" style="width:80px"></label><select id="view"><option value="fan">Fan</option><option value="analyst">Analyst</option></select><button id="copy">复制透明叠加层链接</button><span id="status">连接事件时钟…</span></div>
<main id="stage"><video id="video" controls></video><article id="cue" hidden><small id="source"></small><h2 id="title"></h2><p id="text"></p><small id="refs"></small></article></main>
<script type="module" src="./overlay.js"></script></html>
